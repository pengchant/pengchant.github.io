baseURL = "https://pengchant.github.io/"
languageCode = "zh-cn"
title = "pengchant@dev:~$"

theme = "tokyo-night-terminal"

# 允许 Markdown 中使用 HTML
[markup.goldmark.renderer]
  unsafe = true

# =========================
# Terminal
# =========================
[params]
  prompt = "pengchant@dev:~$"

  # =======================
  # 首页 Dashboard
  # =======================
  [params.dashboard]
    enabled = true

    ascii_art = """
     ____                              __
    / __ \\___  ____  ____  ____ _____/ /_
   / /_/ / _ \\/ __ \\/ __ \\/ __ `/ __  / /
  / ____/  __/ / / / /_/ / /_/ / /_/ / /
 /_/    \\___/_/ /_/\\____/\\__,_/\\__,_/_/
  """

    ascii_color = "#bb9af7"

    title = "Welcome to Peng's Terminal"

    subtitle = "RAG · AI Agent · Docker · DevOps"

    hint = "Press the highlighted keys to navigate."

  # =======================
  # 社交链接
  # =======================

  [[params.social]]
    name = "github"
    url = "https://github.com/pengchant"

  # 如果以后有 LinkedIn，可以打开
  # [[params.social]]
  #   name = "linkedin"
  #   url = "https://www.linkedin.com/in/your-name"

# =========================
# 主菜单
# =========================

[menu]

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

    [menu.main.params]
      shortcut = "a"
      icon = ""

  [[menu.main]]
    identifier = "research"
    name = "Research"
    url = "/research/"
    weight = 20

    [menu.main.params]
      shortcut = "r"
      icon = ""

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 30

    [menu.main.params]
      shortcut = "p"
      icon = ""

  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 40

    [menu.main.params]
      shortcut = "b"
      icon = ""

  [[menu.main]]
    identifier = "skills"
    name = "Skills"
    url = "/skills/"
    weight = 50

    [menu.main.params]
      shortcut = "s"
      icon = ""